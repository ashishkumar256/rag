###############################################################################
# Two-container stack
# 1. chromadb  – official Chroma vector database
# 2. rag       – http.server (PDFs) + LangChain parse/chunk/embed/store + search API
###############################################################################

services:
  # --------------------------------------------------------------------------
  # 1. ChromaDB (vector store)
  # --------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: chromadb
    ports:
      - "8001:8000"          # host:8001 → container:8000
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: /chroma/chroma
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # 2. RAG service
  #    - serves PDFs via Python stdlib http.server (:8080)
  #    - LangChain parse → chunk → embed → store into chromadb
  #    - search API (:8000)
  # --------------------------------------------------------------------------
  rag:
    build: .
    image: rag-db-providers:latest
    container_name: rag
    depends_on:
      chromadb:
        condition: service_healthy
    ports:
      - "8080:8080"          # PDF static server
      - "8000:8000"          # Search / ingest API
    environment:
      PDF_DIR: /data/pdfs
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      COLLECTION_NAME: db_providers
      EMBED_MODEL: BAAI/bge-small-en-v1.5
      CHUNK_SIZE: "800"
      CHUNK_OVERLAP: "150"
      HOST: "0.0.0.0"
      PORT: "8000"
      PDF_PORT: "8080"
      HF_HOME: /data/hf_cache
      TRANSFORMERS_CACHE: /data/hf_cache
    volumes:
      - ../db_proposals:/data/pdfs:ro
      - hf_cache:/data/hf_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  chroma_data:
  hf_cache:

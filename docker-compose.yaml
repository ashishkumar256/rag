###############################################################################
# .env is the single source of truth for configurable values.
# Compose auto-loads .env and substitutes ${VAR} below.
###############################################################################

services:
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: chromadb
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: /chroma/chroma
    volumes:
      - ./chroma_data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  rag:
    build: .
    image: rag-db-providers:latest
    container_name: rag
    depends_on:
      chromadb:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8000:8000"
    environment:
      # Fixed for this compose network / paths
      PDF_DIR: /data/pdfs
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      HF_HOME: /data/hf_cache
      TRANSFORMERS_CACHE: /data/hf_cache
      # From .env (single source of truth)
      COLLECTION_NAME: ${COLLECTION_NAME}
      EMBED_MODEL: ${EMBED_MODEL}
      CHUNK_SIZE: ${CHUNK_SIZE}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP}
      DEFAULT_TOP_K: ${DEFAULT_TOP_K}
      MIN_SCORE: ${MIN_SCORE}
      HOST: ${HOST}
      PORT: ${PORT}
      PDF_PORT: ${PDF_PORT}
      DEBUG: ${DEBUG}
    volumes:
      - ./db_proposals:/data/pdfs:ro
      - ./hf_cache:/data/hf_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
